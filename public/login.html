<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吃什么 - 登录</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --primary:#FF6B35; --primary-light:#FFF0E8; --primary-dark:#E55A2B;
  --ai-blue:#3B82F6; --ai-blue-light:#EFF6FF;
  --green:#10B981; --green-light:#D1FAE5;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563;
  --gray-700:#374151; --gray-800:#1F2937; --gray-900:#111827;
  --radius:12px; --radius-lg:20px;
  --shadow:0 2px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 30px rgba(0,0,0,0.12);
}
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#FF6B35 0%,#FF8E53 50%,#FFB066 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.login-container {
  width:400px; max-width:100%; background:#fff; border-radius:24px;
  padding:40px 32px; box-shadow:0 20px 60px rgba(0,0,0,0.15);
}
.logo-area { text-align:center; margin-bottom:32px; }
.logo-icon {
  width:72px; height:72px; background:var(--primary); border-radius:20px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:36px; margin-bottom:12px; box-shadow:0 8px 20px rgba(255,107,53,0.3);
}
.logo-title { font-size:24px; font-weight:700; color:var(--gray-900); }
.logo-sub { font-size:14px; color:var(--gray-500); margin-top:4px; }

/* 角色选择 */
.role-tabs {
  display:flex; gap:0; background:var(--gray-100); border-radius:12px;
  padding:4px; margin-bottom:24px;
}
.role-tab {
  flex:1; padding:12px; text-align:center; border-radius:8px;
  font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s;
  color:var(--gray-500); display:flex; align-items:center; justify-content:center; gap:6px;
}
.role-tab.active { background:#fff; color:var(--primary); box-shadow:var(--shadow); }

/* 表单 */
.form-group { margin-bottom:16px; }
.form-label { font-size:13px; font-weight:600; color:var(--gray-700); margin-bottom:6px; display:block; }
.form-input {
  width:100%; padding:12px 14px; border:2px solid var(--gray-200); border-radius:10px;
  font-size:15px; color:var(--gray-800); transition:border 0.2s; outline:none;
  background:var(--gray-50);
}
.form-input:focus { border-color:var(--primary); background:#fff; }
.form-input::placeholder { color:var(--gray-400); }

.btn-login {
  width:100%; padding:14px; background:var(--primary); color:#fff;
  border:none; border-radius:12px; font-size:16px; font-weight:600;
  cursor:pointer; transition:all 0.2s; margin-top:8px;
}
.btn-login:hover { background:var(--primary-dark); transform:translateY(-1px); box-shadow:0 6px 16px rgba(255,107,53,0.3); }
.btn-login:active { transform:translateY(0); }
.btn-login:disabled { opacity:0.6; cursor:not-allowed; }

.btn-link {
  width:100%; text-align:center; padding:10px; margin-top:12px;
  font-size:14px; color:var(--gray-500); background:none; border:none; cursor:pointer;
}
.btn-link:hover { color:var(--primary); }

/* 错误提示 */
.error-msg {
  background:#FEE2E2; color:#DC2626; padding:10px 14px; border-radius:8px;
  font-size:13px; margin-bottom:16px; display:none;
}

/* 测试账号提示 */
.demo-info {
  margin-top:24px; padding:16px; background:var(--ai-blue-light); border-radius:12px;
  border:1px solid #DBEAFE;
}
.demo-info-title { font-size:13px; font-weight:600; color:var(--ai-blue); margin-bottom:8px; }
.demo-info-row { font-size:13px; color:var(--gray-600); line-height:1.8; }
.demo-info-row code { background:#fff; padding:2px 6px; border-radius:4px; font-size:12px; border:1px solid var(--gray-200); }

/* 注册表单切换 */
.register-fields { display:none; }

/* Loading */
.spinner {
  display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Toast */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  padding:12px 24px; border-radius:12px; font-size:14px; font-weight:500;
  z-index:9999; opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.toast.show { opacity:1; }
.toast.success { background:var(--green); color:#fff; }
.toast.error { background:#EF4444; color:#fff; }
</style>
</head>
<body>
<div class="login-container">
  <div class="logo-area">
    <div class="logo-icon">🍜</div>
    <div class="logo-title">吃什么</div>
    <div class="logo-sub">校园AI智能就餐推荐助手</div>
  </div>

  <div class="role-tabs">
    <div class="role-tab active" data-role="student" onclick="switchRole('student')">
      <span>🎓</span> 学生端
    </div>
    <div class="role-tab" data-role="admin" onclick="switchRole('admin')">
      <span>⚙️</span> 管理端
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- 登录表单 -->
  <div id="loginForm">
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名" value="">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" value="">
    </div>
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">登 录</button>
    <button class="btn-link" id="switchToRegister" onclick="showRegister()">没有账号？点击注册（仅学生）</button>
  </div>

  <!-- 注册表单 -->
  <div id="registerForm" style="display:none;">
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" class="form-input" id="regUsername" placeholder="设置用户名">
    </div>
    <div class="form-group">
      <label class="form-label">昵称</label>
      <input type="text" class="form-input" id="regName" placeholder="你的昵称（选填）">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" id="regPassword" placeholder="设置密码">
    </div>
    <div class="form-group">
      <label class="form-label">确认密码</label>
      <input type="password" class="form-input" id="regPassword2" placeholder="再次输入密码">
    </div>
    <button class="btn-login" id="registerBtn" onclick="handleRegister()">注 册</button>
    <button class="btn-link" onclick="showLogin()">已有账号？返回登录</button>
  </div>

  <div class="demo-info">
    <div class="demo-info-title">💡 测试账号</div>
    <div class="demo-info-row">管理员: <code>admin</code> / <code>admin123</code></div>
    <div class="demo-info-row">学&nbsp;&nbsp;生: <code>student</code> / <code>123456</code></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = ''; // 同源
let currentRole = 'student';

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-role="${role}"]`).classList.add('active');
  showLogin(); // 切换角色时回到登录表单
  
  // 预填测试账号
  if (role === 'admin') {
    document.getElementById('loginUsername').value = 'admin';
    document.getElementById('loginPassword').value = 'admin123';
    document.getElementById('switchToRegister').style.display = 'none';
  } else {
    document.getElementById('loginUsername').value = 'student';
    document.getElementById('loginPassword').value = '123456';
    document.getElementById('switchToRegister').style.display = 'block';
  }
}

function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  hideError();
}

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  hideError();
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function handleLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  
  if (!username || !password) { showError('请输入用户名和密码'); return; }
  
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>登录中...';
  hideError();
  
  try {
    const res = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, role: currentRole })
    });
    const data = await res.json();
    
    if (!res.ok) {
      showError(data.error || '登录失败');
      btn.disabled = false;
      btn.innerHTML = '登 录';
      return;
    }
    
    // 保存 token 和用户信息
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    
    showToast('登录成功，正在跳转...', 'success');
    
    // 根据角色跳转
    setTimeout(() => {
      if (data.user.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'student.html';
      }
    }, 800);
    
  } catch (err) {
    showError('网络错误，请检查服务器是否启动');
    btn.disabled = false;
    btn.innerHTML = '登 录';
  }
}

async function handleRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const name = document.getElementById('regName').value.trim();
  const password = document.getElementById('regPassword').value.trim();
  const password2 = document.getElementById('regPassword2').value.trim();
  
  if (!username || !password) { showError('请输入用户名和密码'); return; }
  if (password !== password2) { showError('两次密码不一致'); return; }
  if (password.length < 4) { showError('密码至少4位'); return; }
  
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>注册中...';
  hideError();
  
  try {
    const res = await fetch(API_BASE + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, name })
    });
    const data = await res.json();
    
    if (!res.ok) {
      showError(data.error || '注册失败');
      btn.disabled = false;
      btn.innerHTML = '注 册';
      return;
    }
    
    showToast('注册成功！请登录', 'success');
    // 自动填充用户名
    document.getElementById('loginUsername').value = username;
    document.getElementById('loginPassword').value = '';
    showLogin();
    btn.disabled = false;
    btn.innerHTML = '注 册';
    
  } catch (err) {
    showError('网络错误，请检查服务器是否启动');
    btn.disabled = false;
    btn.innerHTML = '注 册';
  }
}

// 回车提交
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('regPassword2').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleRegister();
});

// 初始化预填
switchRole('student');
</script>
</body>
</html>
